version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # requirements*.txt use open-ended floors (numpy>=1.24). Without this, Dependabot raises the floor on every release
    # ("numpy >=1.24 to >=2.5.4"), which makes the package unsatisfiable on Python 3.10 / 3.11. Only touch a requirement when it is really needed.
    versioning-strategy: increase-if-necessary
    ignore:
      - dependency-name: "numpy"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pandas"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly

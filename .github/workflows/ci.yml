name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: No credentials in the tree
        run: python scripts/check_secrets.py
      - name: Offline test suite (no network, no broker, no API key)
        run: python -m pytest -q

  dashboard-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: pip install -r requirements-dev.txt
      - run: npm install --no-save jsdom
      - name: Wizard -> run swarm -> pages -> lab -> journal (headless DOM)
        run: |
          python tests/serve_smoke.py > server.log 2>&1 &
          sleep 6
          PHASE=1 node tests/dashboard_smoke.js
          PHASE=2 node tests/dashboard_smoke.js
          PHASE=3 node tests/dashboard_smoke.js
      - name: MT5 linking through the UI (stubbed Exness-style terminal)
        run: |
          pkill -f serve_smoke.py || true
          sleep 1
          SMOKE_MT5_STUB=1 SMOKE_ROOT=/tmp/swarm_smoke_mt5 python tests/serve_smoke.py > server_mt5.log 2>&1 &
          sleep 6
          PHASE=4 node tests/dashboard_smoke.js
      - if: failure()
        run: tail -n 50 server.log server_mt5.log || true
